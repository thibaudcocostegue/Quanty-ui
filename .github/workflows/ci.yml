name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # lint is disabled until ESLint is actually configured (no config file exists yet)
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @quanty-ui/cli build
